    /* ========================================================
       狀態管理
       ======================================================== */
    let currentDay = 1;
    let currentCategory = 'all';
    let checkedItems = new Set();

    // 初始化儲存庫
    function initLocalStorage() {
      try {
        const saved = localStorage.getItem('kl_itinerary_checked');
        if (saved) {
          checkedItems = new Set(JSON.parse(saved));
        }
      } catch (e) {
        console.warn('LocalStorage error:', e);
      }
    }

    function saveCheckState() {
      try {
        localStorage.setItem('kl_itinerary_checked', JSON.stringify([...checkedItems]));
      } catch(e) {}
      updateProgress();
    }

    /* ========================================================
       類別樣式對照表
       ======================================================== */
    const categoryStyles = {
      food: {
        badge: "bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border-amber-200 dark:border-amber-800",
        icon: "fa-utensils text-amber-500",
        name: "美食"

      spot: {
        badge: "bg-sky-100 text-sky-800 dark:bg-sky-950/80 dark:text-sky-300 border-sky-200 dark:border-sky-800",

        name: "交通"

        icon: "fa-hotel text-emerald-500",
        name: "住宿"
      }
    };

    /* ========================================================
       渲染：天數選單 Tabs
       ======================================================== */
    function renderTabs() {
      const container = document.getElementById('dayTabsContainer');
      container.innerHTML = ITINERARY_DATA.map(d => {
        const isActive = d.day === currentDay;
        const activeClass = isActive 
          ? "bg-teal-600 text-white shadow-md shadow-teal-600/30 font-bold scale-[1.02]" 
          : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200/80 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium";

        return `
          <button onclick="switchDay(${d.day})" class="px-4 py-2.5 rounded-2xl transition-all duration-200 flex items-center gap-2 text-sm ${activeClass}">
            <span class="w-6 h-6 rounded-lg ${isActive ? 'bg-white/20' : 'bg-slate-100 dark:bg-slate-800'} flex items-center justify-center text-xs">
              D${d.day}
            </span>
            <div class="text-left">
              <div class="leading-none text-xs ${isActive ? 'text-teal-100' : 'text-slate-400'}">${d.date.split(' ')[0]}</div>
              <div class="text-sm font-bold truncate max-w-[120px] sm:max-w-none">${d.badge}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    /* ========================================================
       渲染：每日重要提醒卡片
       ======================================================== */
    function renderTipBox() {
      const dayData = ITINERARY_DATA.find(d => d.day === currentDay);
      const container = document.getElementById('dayNoticeBox');
      if (!dayData || !dayData.tips) return;

      container.className = `p-4 sm:p-5 rounded-3xl border transition-all duration-300 ${dayData.tips.style}`;
      container.innerHTML = `
        <div class="flex items-start gap-3.5">
          <div class="p-2.5 rounded-xl bg-white/60 dark:bg-black/40 text-lg flex-shrink-0">
            <i class="fa-solid ${dayData.tips.icon}"></i>
          </div>
          <div class="space-y-1 text-sm">
            <h4 class="font-bold text-base leading-snug">${dayData.tips.title}</h4>
            <div class="text-xs sm:text-sm opacity-90 leading-relaxed">${dayData.tips.desc}</div>
          </div>
        </div>
      `;
    }

    /* ========================================================
       渲染：行程時間軸清單
       ======================================================== */
    function renderTimeline() {
      const dayData = ITINERARY_DATA.find(d => d.day === currentDay);
      const container = document.getElementById('timelineContainer');
      
      // 更新快捷列狀態文字
      document.getElementById('quickStatus').innerText = `Day ${dayData.day} : ${dayData.title.split('（')[0]}`;

      // 依分類過濾
      let items = dayData.items;
      if (currentCategory !== 'all') {
        items = items.filter(i => i.category === currentCategory);
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-400 bg-white/50 dark:bg-slate-900/50 rounded-3xl border border-dashed border-slate-200 dark:border-slate-800">
            <i class="fa-solid fa-list-check text-4xl mb-3 opacity-30"></i>
            <p class="text-sm">此分類在今天沒有排定項目</p>
            <button onclick="setCategoryFilter('all')" class="mt-3 text-xs text-teal-600 dark:text-teal-400 underline font-medium">查看當日所有行程</button>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(item => {
        const isChecked = checkedItems.has(item.id);
        const styleInfo = categoryStyles[item.category] || categoryStyles.spot;

        return `
          <div class="relative group transition-all duration-200">
            <!-- 時間軸節點圓圈 -->
            <div onclick="toggleCheck('${item.id}')" class="absolute -left-[30px] sm:-left-[38px] top-4 w-7 h-7 rounded-full border-2 cursor-pointer flex items-center justify-center transition-all duration-300 z-10 ${
              isChecked 
                ? 'bg-teal-500 border-teal-500 text-white shadow-md shadow-teal-500/30 ring-4 ring-teal-100 dark:ring-teal-950' 
                : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 hover:border-teal-400 text-transparent'
            }">
              <i class="fa-solid fa-check text-xs"></i>
            </div>

            <!-- 行程內容卡片 -->
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-4 sm:p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md transition-all duration-200 ${isChecked ? 'opacity-65 dark:opacity-50' : ''}">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono text-xs font-semibold">
                    <i class="fa-regular fa-clock mr-1 text-slate-400"></i>${item.time}
                  </span>
                  <span class="text-xs px-2.5 py-0.5 rounded-full border ${styleInfo.badge} flex items-center gap-1 font-medium">
                    <i class="fa-solid ${styleInfo.icon} text-[10px]"></i> ${styleInfo.name}
                  </span>
                  ${item.tag ? `<span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 font-medium">${item.tag}</span>` : ''}
                </div>

                <div class="flex items-center gap-2 self-end sm:self-auto">
                  <button onclick="searchMap('${encodeURIComponent(item.title)}')" class="text-xs px-2.5 py-1 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition" title="Google Maps 導航">
                    <i class="fa-solid fa-diamond-turn-right text-teal-600 dark:text-teal-400 mr-1"></i>導航
                  </button>
                  <button onclick="toggleCheck('${item.id}')" class="text-xs px-2.5 py-1 rounded-xl transition ${
                    isChecked 
                      ? 'bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300' 
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
                  }">
                    ${isChecked ? '<i class="fa-solid fa-circle-check mr-1 text-teal-500"></i>已打卡' : '<i class="fa-regular fa-circle mr-1"></i>打卡'}
                  </button>
                </div>
              </div>

              <h3 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white mt-1 ${isChecked ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                ${item.title}
              </h3>

              <div class="mt-2 text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed bg-slate-50/80 dark:bg-slate-800/50 p-3 rounded-2xl border border-slate-100 dark:border-slate-800">
                ${item.note}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* ========================================================
       進度更新
       ======================================================== */
    function updateProgress() {
      let total = 0;
      ITINERARY_DATA.forEach(day => {
        total += day.items.length;
      });

      const checkedCount = checkedItems.size;
      const pct = total === 0 ? 0 : Math.round((checkedCount / total) * 100);

      document.getElementById('progressText').innerText = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('taskCountText').innerText = `${checkedCount} / ${total} 已完成`;
    }

    /* ========================================================
       操作函數
       ======================================================== */
    function switchDay(day) {
      currentDay = day;
      renderTabs();
      renderTipBox();
      renderTimeline();
    }

    function setCategoryFilter(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'filter-btn active px-3 py-1.5 rounded-full font-bold bg-teal-600 text-white transition shadow-sm';
        } else {
          btn.className = 'filter-btn px-3 py-1.5 rounded-full font-medium bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition';
        }
      });
      renderTimeline();
    }

    function toggleCheck(id) {
      if (checkedItems.has(id)) {
        checkedItems.delete(id);
      } else {
        checkedItems.add(id);
      }
      saveCheckState();
      renderTimeline();
    }

    function resetAllChecks() {
      if (confirm('確定要重設所有項目的打卡紀錄嗎？')) {
        checkedItems.clear();
        saveCheckState();
        renderTimeline();
      }
    }

    function searchMap(keyword) {
      window.open(`https://www.google.com/maps/search/?api=1&query=${keyword}+Malaysia`, '_blank');
    }

    function sharePlan() {
      const shareUrl = window.location.href;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast('行程連結已複製到剪貼簿！');
        }).catch(() => {
          fallbackCopyText(shareUrl);
        });
      } else {
        fallbackCopyText(shareUrl);
      }
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast('行程連結已複製！');
      } catch (err) {
        showToast('請直接複製瀏覽器上方網址分享！');
      }
      document.body.removeChild(textArea);
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl border border-slate-700 flex items-center gap-2 animate-bounce';
      toast.innerHTML = `<i class="fa-solid fa-circle-info text-teal-400"></i> ${msg}`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 2500);
    }

    /* ========================================================
       匯率計算小工具
       ======================================================== */
    const EXCHANGE_RATE = 7.15; // 1 MYR ≈ 7.15 TWD

    function toggleCurrencyModal() {
      const modal = document.getElementById('currencyModal');
      modal.classList.toggle('hidden');
    }

    function calculateCurrency(from) {
      const myrInput = document.getElementById('inputMYR');
      const twdInput = document.getElementById('inputTWD');
      if (from === 'MYR') {
        const val = parseFloat(myrInput.value) || 0;
        twdInput.value = (val * EXCHANGE_RATE).toFixed(1);
      } else {
        const val = parseFloat(twdInput.value) || 0;
        myrInput.value = (val / EXCHANGE_RATE).toFixed(1);
      }
    }

    /* ========================================================
       主題切換
       ======================================================== */
    const themeBtn = document.getElementById('themeToggle');
    function initTheme() {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    themeBtn.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    });

    /* ========================================================
       啟動
       ======================================================== */
    window.onload = function() {
      initTheme();
      initLocalStorage();
      renderTabs();
      renderTipBox();
      setCategoryFilter('all');
      updateProgress();
    };
  </script>
</body>
</html>
